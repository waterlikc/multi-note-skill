<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .note-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .note-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 40px;
    }
    
    .note-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .note-meta {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    
    .note-body {
      padding: 40px;
      line-height: 1.8;
      color: #333;
    }
    
    .note-body h1 {
      font-size: 1.8rem;
      color: #2d3748;
      margin: 2em 0 0.8em;
      padding-bottom: 0.3em;
      border-bottom: 2px solid #e2e8f0;
    }
    
    .note-body h2 {
      font-size: 1.5rem;
      color: #4a5568;
      margin: 1.8em 0 0.6em;
    }
    
    .note-body h3 {
      font-size: 1.3rem;
      color: #718096;
      margin: 1.5em 0 0.5em;
    }
    
    .note-body p {
      margin-bottom: 1em;
    }
    
    .note-body ul, .note-body ol {
      margin: 1em 0;
      padding-left: 2em;
    }
    
    .note-body li {
      margin-bottom: 0.5em;
    }
    
    .note-body code {
      background: #f7fafc;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 0.9em;
      color: #e53e3e;
    }
    
    .note-body pre {
      background: #1a202c;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1.5em 0;
    }
    
    .note-body pre code {
      background: none;
      color: inherit;
      padding: 0;
    }
    
    .note-body blockquote {
      border-left: 4px solid #667eea;
      padding: 10px 20px;
      margin: 1.5em 0;
      background: #f7fafc;
      border-radius: 0 8px 8px 0;
    }
    
    .note-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
    }
    
    .note-body th, .note-body td {
      border: 1px solid #e2e8f0;
      padding: 12px;
      text-align: left;
    }
    
    .note-body th {
      background: #f7fafc;
      font-weight: 600;
    }
    
    .note-body strong {
      color: #2d3748;
      font-weight: 600;
    }
    
    .note-body em {
      color: #667eea;
    }
    
    .note-footer {
      background: #f7fafc;
      padding: 20px 40px;
      text-align: center;
      font-size: 0.85rem;
      color: #a0aec0;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    
    .badge-technical { background: #ebf8ff; color: #2b6cb0; }
    .badge-classroom { background: #fefcbf; color: #975a16; }
    .badge-meeting { background: #f0fff4; color: #276749; }
  </style>
</head>
<body>
  <div class="container">
    <div class="note-card">
      <div class="note-header">
        <h1 class="note-title">{{TITLE}}</h1>
        <div class="note-meta">
          {{#SUBTITLE}}<span>{{SUBTITLE}}</span>{{/SUBTITLE}}
          <span>📅 {{DATE}}</span>
          <span class="badge badge-{{SCENE}}">{{SCENE_LABEL}}</span>
        </div>
      </div>
      
      <div class="note-body">
        {{CONTENT}}
      </div>
      
      <div class="note-footer">
        <p>📝 由 multi-note-skill 生成 | 版本 {{VERSION}}</p>
      </div>
    </div>
  </div>
</body>
</html>
